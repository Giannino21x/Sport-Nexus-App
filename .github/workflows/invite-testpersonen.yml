# Einmaliger, zeitgesteuerter Versand der Beta-Test-Einladungen an Pascals
# 8 Testpersonen (Freigabe Pascal 22.07.) — läuft in der GitHub-Cloud,
# der lokale Rechner muss dafür nicht an sein.
#
# Zeitplan: 23.07.2026 07:00 UTC = 09:00 Schweiz. GitHub kann Cron-Starts um
# einige Minuten verzögern. Der Datums-Guard verhindert, dass der (jährliche)
# Cron je nochmal feuert — nach dem Versand diesen Workflow trotzdem löschen.
#
# Secret ENV_LOCAL = Inhalt der lokalen .env.local (HubSpot, Supabase, SMTP).
name: invite-testpersonen

on:
  schedule:
    - cron: "0 7 23 7 *"
  workflow_dispatch:

jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Datums-Guard (nur 23.07.2026; manueller Start immer erlaubt)
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%F)" != "2026-07-23" ]; then
            echo "Nicht der geplante Tag ($(date -u +%F)) — Abbruch ohne Versand."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: .env.local aus Secret schreiben
        run: printf '%s' "$ENV_LOCAL" > .env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
      - name: Beta-Einladungen an die 8 Testpersonen senden
        run: |
          set -o pipefail
          node scripts/hubspot-onboard.mjs --live --beta --reinvite \
            --status="Founder,Seed Member,Early Member,Regular Member,Stellvertreter,Premium Sponsor,Moderation" \
            --only=stefan.freivogel@bdo.ch,vanessa.andrighetto@hispeed.ch,dominik.hert@finaccess.ch,florian.stuerchler@rh-finanz.ch,franck.kempfer@wavestone.com,marc.thommen@weckerleag.ch,spitteler@swissindoorsbasel.ch,corinne.heusser@ebl.ch \
            2>&1 | tee invite.log
      - name: Protokoll an Giannino mailen (Erfolg wie Fehler)
        if: always()
        run: node scripts/mail-run-log.mjs "${{ job.status }}" invite.log
